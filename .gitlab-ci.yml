# .gitlab-ci.yml

image: mcr.microsoft.com/playwright:v1.47.2-jammy

stages:
  - test

e2e-tests:
  stage: test
  script:
    - npm install -g yarn
    - yarn
    - yarn run e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - results.xml
    reports:
      junit: results.xml